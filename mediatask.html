<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>media query task</title>
    <style>
        *
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container
        {
            max-width: 100vw;
            min-height: 100vh;
            background-color: black;
            display: flex;
            flex-wrap: wrap;
            justify-content:space-evenly;
            gap: 10px;
        }
        .box1
        {
            flex-basis: 98%;
            height: 20vh;
            background-color:greenyellow;
        }
        .box2
        {
            flex-basis: 32%;
            height: 50vh;
            background-color: blue;
        }
        .box3
        {
            flex-basis: 23%;
            height: 30vh;
            background-color: gainsboro;
        }
        @media screen and ( max-width:900px)
        {
            .container
            {

                gap: 10px;
            }
            .box1
            {
                flex-basis: 90%;
            }
            .box2
            {
                flex-basis: 90%;
            }
            .box3
            {
                flex-basis: 42%;
            }
        }
        @media screen and (max-width:500px)
        {
            .box3
            {
                flex-basis: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box2"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box3"></div>
        <div class="box3"></div>
        <div class="box3"></div>
    </div>
</body>
</html>
